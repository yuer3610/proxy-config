# Loon Proxy Groups

# 类型-地区策略组：每个筛选器分别建立 URL-Test 与负载均衡组。
# 节点筛选范围：所有已导入订阅。
# URL-Test：600 秒检测间隔，50ms 容差。
# Load Balance：PCC，同一主机名尽量保持在同一节点。

[Proxy Group]

URLtest-普通-香港 = url-test, 普通-香港, url=http://www.gstatic.com/generate_204, interval=600, tolerance=50
负载均衡-普通-香港 = load-balance, 普通-香港, url=http://www.gstatic.com/generate_204, interval=600, algorithm=PCC


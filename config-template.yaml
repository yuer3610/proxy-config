# MiSub custom remote template for Mihomo
# Based on common community configuration patterns and Mihomo official schema.
# Strategy groups and routing rules are kept aligned with the project's approved files.
# MiSub documented placeholders: <%proxies%>, <%fileName%>, <%interval%>.
# Do not add <%rules%> here: routing rules are explicitly maintained below.

# ==================== General ====================
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
tcp-concurrent: true
unified-delay: true
find-process-mode: strict

# Keep controller local to this machine. Do not expose it to LAN/WireGuard.
external-controller: 127.0.0.1:9090

# Persist selected proxies and Fake-IP mappings across restarts.
profile:
  store-selected: true
  store-fake-ip: true

# ==================== GEO data ====================
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 72
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"

# ==================== Sniffer ====================
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# ==================== TUN ====================
# Deliberately disabled: this profile uses ordinary proxy ports and LAN/WireGuard access.
tun:
  enable: false

# ==================== DNS ====================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "geosite:private"
    - "+.lan"
    - "+.local"
  use-hosts: true
  use-system-hosts: true
  cache-algorithm: arc
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - "https://1.1.1.1/dns-query"
    - "https://8.8.8.8/dns-query"
  nameserver-policy:
    "geosite:cn,private":
      - "https://223.5.5.5/dns-query"
      - "https://119.29.29.29/dns-query"

# ==================== Proxies from MiSub ====================
proxies:
<%proxies%>

# ==================== Project proxy groups ====================
proxy-groups:
  - name: URLtest香港
    type: url-test
    include-all: true
    filter: "(?i)(香港|港|\\bHK\\b|\\bHKG\\b|Hong[ ._-]?Kong)"
    exclude-filter: "(?i)((家宽|家用宽带|原生住宅|住宅|Residential|ISP)|(IPLC|IEPL)|(倍率[：:]?\\s*(2\\.[0-9]*[1-9][0-9]*|[3-9]([.][0-9]+)?|[1-9][0-9]+([.][0-9]+)?)|(2\\.[0-9]*[1-9][0-9]*|[3-9]([.][0-9]+)?|[1-9][0-9]+([.][0-9]+)?)\\s*(倍|x|×)|x\\s*(2\\.[0-9]*[1-9][0-9]*|[3-9]([.][0-9]+)?|[1-9][0-9]+([.][0-9]+)?)))"

  - name: URLtest日本
    type: url-test
    include-all: true
    filter: "(?i)(日本|\\bJP\\b|\\bJPN\\b|Japan)"
    exclude-filter: "(?i)((家宽|家用宽带|原生住宅|住宅|Residential|ISP)|(IPLC|IEPL)|(倍率[：:]?\\s*(2\\.[0-9]*[1-9][0-9]*|[3-9]([.][0-9]+)?|[1-9][0-9]+([.][0-9]+)?)|(2\\.[0-9]*[1-9][0-9]*|[3-9]([.][0-9]+)?|[1-9][0-9]+([.][0-9]+)?)\\s*(倍|x|×)|x\\s*(2\\.[0-9]*[1-9][0-9]*|[3-9]([.][0-9]+)?|[1-9][0-9]+([.][0-9]+)?)))"

  - name: URLtest台湾
    type: url-test
    include-all: true
    filter: "(?i)(台湾|台灣|\\bTW\\b|\\bTWN\\b|Taiwan)"
    exclude-filter: "(?i)((家宽|家用宽带|原生住宅|住宅|Residential|ISP)|(IPLC|IEPL)|(倍率[：:]?\\s*(2\\.[0-9]*[1-9][0-9]*|[3-9]([.][0-9]+)?|[1-9][0-9]+([.][0-9]+)?)|(2\\.[0-9]*[1-9][0-9]*|[3-9]([.][0-9]+)?|[1-9][0-9]+([.][0-9]+)?)\\s*(倍|x|×)|x\\s*(2\\.[0-9]*[1-9][0-9]*|[3-9]([.][0-9]+)?|[1-9][0-9]+([.][0-9]+)?)))"

